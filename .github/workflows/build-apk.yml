name: Build BW Foot Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository"
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR=$(find extracted -type f -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT_DIR")" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BW-Foot-Android-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
